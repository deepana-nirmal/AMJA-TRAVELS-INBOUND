<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin · Amja Travels Inbound</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" href="../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#182A44;--ink-70:rgba(24,42,68,.72);--ink-45:rgba(24,42,68,.45);--line:rgba(24,42,68,.14);
  --paper:#FBF6EF;--paper-2:#F3E9DA;--cream:#FFFDF9;--deep:#122036;
  --sun:#DC7A34;--sun-deep:#B4551F;--gold:#E7B15A;--sky:#3E6DA6;
  --serif:"Fraunces",Georgia,serif;--body:"Inter",system-ui,sans-serif;--e:cubic-bezier(.19,1,.22,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);background:var(--paper);color:var(--ink);min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:var(--body);cursor:pointer}
img{display:block;max-width:100%}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em}

.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--deep);color:var(--paper);padding:26px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .brand{font-family:var(--serif);font-size:1.35rem;display:flex;align-items:center;gap:8px}
.side .brand .arm{font-family:var(--body);font-size:.55rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;background:var(--sun);color:#fff;padding:3px 7px;border-radius:5px}
.side .tag{font-size:.56rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.45);margin:6px 0 28px}
.side .grp{font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.4);margin:20px 0 10px}
.navi{display:flex;flex-direction:column;gap:2px}
.navi a{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:10px;font-size:.86rem;color:rgba(255,255,255,.78);transition:background .25s,color .25s}
.navi a:hover{background:rgba(255,255,255,.06);color:#fff}
.navi a.on{background:var(--sun);color:#fff}
.badge{background:var(--gold);color:#3a2a12;font-size:.64rem;font-weight:700;border-radius:100px;padding:2px 8px;min-width:20px;text-align:center;display:none}
.badge.show{display:inline-block}
.side .foot{margin-top:auto;padding-top:20px;border-top:1px solid rgba(255,255,255,.12)}
.side .foot a{font-size:.8rem;color:rgba(255,255,255,.6);display:block;padding:8px 0}
.side .foot a:hover{color:#fff}

.main{padding:34px 40px}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:30px;gap:20px;flex-wrap:wrap}
.top h1{font-size:2.1rem;line-height:1}
.top .sub{color:var(--ink-45);font-size:.86rem;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--sun);color:#fff;border:0;border-radius:100px;padding:12px 22px;font-weight:600;font-size:.82rem;transition:background .3s}
.btn:hover{background:var(--sun-deep)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink-70)}
.btn.ghost:hover{border-color:var(--sun);color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.item{background:var(--cream);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.item .ph{aspect-ratio:16/10;background:var(--paper-2);overflow:hidden}
.item .ph img{width:100%;height:100%;object-fit:cover}
.item .b{padding:18px 20px;flex:1;display:flex;flex-direction:column}
.item .b .k{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--sun-deep)}
.item .b h3{font-size:1.25rem;margin:6px 0}
.item .b p{color:var(--ink-70);font-size:.84rem;line-height:1.55;flex:1}
.item .b .gtag{font-size:.68rem;color:var(--ink-45);margin-top:8px}
.item .b .row{display:flex;gap:8px;margin-top:14px}
.item .b .row button{flex:1;padding:9px;border-radius:8px;font-size:.76rem;font-weight:600;border:0}
.item .b .edit{background:var(--paper-2);color:var(--ink)}
.item .b .edit:hover{background:var(--line)}
.item .b .del{background:#FDECEA;color:#C0392B}
.item .b .del:hover{background:#f8d7d3}
.empty,.loading{text-align:center;padding:80px 20px;color:var(--ink-45)}
.empty h3{font-size:1.5rem;color:var(--ink-70);margin-bottom:10px}

.enq-row{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:20px 24px;margin-bottom:12px;display:flex;gap:20px;align-items:flex-start}
.enq-row.unread{border-left:3px solid var(--sun)}
.enq-row .who{flex:1}
.enq-row .who .n{font-weight:600;font-size:1rem}
.enq-row .who .meta{font-size:.78rem;color:var(--ink-45);margin-top:2px}
.enq-row .who .msg{margin-top:10px;color:var(--ink-70);font-size:.88rem;line-height:1.5}
.enq-row .who .tag{display:inline-block;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--sun-deep);background:var(--paper-2);border-radius:100px;padding:3px 10px;margin-top:8px}
.enq-row .act{display:flex;flex-direction:column;gap:6px;min-width:120px}
.enq-row .act button{padding:8px 12px;border-radius:8px;font-size:.74rem;font-weight:600;border:1px solid var(--line);background:none;color:var(--ink-70)}
.enq-row .act button:hover{border-color:var(--sun);color:var(--ink)}
.enq-row .act .date{font-size:.7rem;color:var(--ink-45);text-align:right}

.modal{position:fixed;inset:0;z-index:100;background:rgba(18,32,54,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:24px}
.modal.open{display:flex}
.modal .sheet{background:var(--cream);border-radius:20px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:34px 36px}
.modal h2{font-size:1.7rem;margin-bottom:22px}
.modal label{display:block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink-70);margin:16px 0 6px}
.modal input,.modal textarea,.modal select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-family:var(--body);font-size:.9rem;color:var(--ink);outline:none;transition:border-color .3s;background:#fff}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--sun)}
.modal textarea{resize:vertical;min-height:90px}
.modal .hint{font-size:.72rem;color:var(--ink-45);margin-top:5px}
.modal .imgprev{margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-width:220px;display:none}
.modal .imgprev.show{display:block}
.modal .imgprev img{width:100%;height:auto}
.modal .acts{display:flex;gap:12px;margin-top:28px}
.modal .acts button{flex:1;padding:13px;border-radius:100px;font-weight:600;font-size:.85rem;border:0}
.enq-detail .fld{padding:12px 0;border-bottom:1px solid var(--line)}
.enq-detail .fld:last-child{border-bottom:0}
.enq-detail .lbl{font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-45);margin-bottom:4px}
.enq-detail .val{font-size:.95rem;line-height:1.55;word-break:break-word}
.enq-detail .val a{color:var(--sun-deep);font-weight:600}
.enq-detail .val.msg{white-space:pre-wrap}
.enq-detail .tags{display:flex;flex-wrap:wrap;gap:8px}
.enq-detail .tags span{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--sun-deep);background:var(--paper-2);border-radius:100px;padding:4px 12px}

.confirm{position:fixed;inset:0;z-index:150;background:rgba(18,32,54,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:24px}
.confirm.open{display:flex}
.confirm .card{background:var(--cream);border-radius:20px;width:100%;max-width:420px;padding:32px 34px;text-align:center;animation:tin .3s var(--e)}
.confirm .ic{width:56px;height:56px;border-radius:50%;background:#FDECEA;color:#C0392B;display:grid;place-items:center;margin:0 auto 18px}
.confirm .ic svg{width:26px;height:26px}
.confirm h3{font-size:1.4rem;margin-bottom:8px}
.confirm p{color:var(--ink-70);font-size:.9rem;line-height:1.5;margin-bottom:26px}
.confirm .acts{display:flex;gap:12px}
.confirm .acts button{flex:1;padding:13px;border-radius:100px;font-weight:600;font-size:.85rem;border:0}
.confirm .cancel{background:var(--paper-2);color:var(--ink)}
.confirm .ok{background:#C0392B;color:#fff}
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--ink);color:var(--paper);padding:14px 20px;border-radius:12px;font-size:.86rem;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .3s var(--e)}
.toast.ok{background:#227A54}.toast.err{background:#C0392B}
@keyframes tin{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}

@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px}
  .side .brand,.side .tag,.side .grp,.side .foot{width:100%}
  .side .foot{margin-top:14px}
  .navi{flex-direction:row;flex-wrap:wrap}
  .navi a{flex:0 0 auto}
  .main{padding:24px 18px}
  .enq-row{flex-direction:column;gap:14px}
  .enq-row .act{flex-direction:row;flex-wrap:wrap;min-width:0;width:100%}
  .enq-row .act .date{order:-1;text-align:left;width:100%}
  .enq-row .act button{flex:1}
  .modal .sheet{padding:26px 22px}
  .modal .acts,.confirm .acts{flex-direction:column}
  .grid{grid-template-columns:1fr}
  .toast-wrap{right:12px;left:12px;bottom:12px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Amja Travels <span class="arm">Inbound</span></div>
    <div class="tag">Content Admin</div>
    <div class="grp">Catalog</div>
    <nav class="navi" id="cats"></nav>
    <div class="grp">Enquiries</div>
    <nav class="navi">
      <a data-view="enquiries" id="enqLink">Inbox <span class="badge" id="enqBadge">0</span></a>
    </nav>
    <div class="foot">
      <a href="../index.html" target="_blank">View website ↗</a>
      <a href="#" id="logout">Sign out</a>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <div><h1 id="viewTitle">Dashboard</h1><div class="sub" id="viewSub"></div></div>
      <button class="btn" id="addBtn" style="display:none">+ Add new</button>
    </div>
    <div id="content"><div class="loading">Loading…</div></div>
  </main>
</div>

<div class="modal" id="modal"><div class="sheet">
  <h2 id="modalTitle">Add item</h2>
  <form id="itemForm"></form>
  <div class="acts">
    <button class="btn ghost" id="cancelBtn" type="button">Cancel</button>
    <button class="btn" id="saveBtn" type="button">Save</button>
  </div>
</div></div>

<div class="confirm" id="confirm"><div class="card">
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></div>
  <h3 id="confirmTitle">Delete?</h3>
  <p id="confirmMsg">This cannot be undone.</p>
  <div class="acts"><button class="cancel" id="confirmCancel">Cancel</button><button class="ok" id="confirmOk">Delete</button></div>
</div></div>

<div class="modal" id="enqModal"><div class="sheet">
  <h2 id="enqTitle">Enquiry</h2>
  <div id="enqBody" class="enq-detail"></div>
  <div class="acts">
    <button class="btn ghost" id="enqClose" type="button">Close</button>
    <a class="btn" id="enqReply" href="#" style="text-align:center">Reply by email</a>
  </div>
</div></div>

<div class="toast-wrap" id="toasts"></div>

<script type="module">
import { requireAdmin, logout } from '../assets/auth.js';
import { CATEGORIES, INBOUND_CATEGORIES } from '../assets/categories.js';
import { listItems, saveItem, deleteItem, listEnquiries, updateEnquiry, deleteEnquiry } from '../assets/db.js';

const $ = s => document.querySelector(s);
const content = $('#content'), modal = $('#modal'), form = $('#itemForm');
let currentCat = null, editingId = null;

await requireAdmin('/admin/login.html');

function toast(msg, type='') {
  const t = document.createElement('div');
  t.className = 'toast ' + type; t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
function confirmDialog(title, message, okLabel = 'Delete') {
  return new Promise(resolve => {
    const box = $('#confirm');
    $('#confirmTitle').textContent = title;
    $('#confirmMsg').textContent = message;
    $('#confirmOk').textContent = okLabel;
    box.classList.add('open');
    const cleanup = (val) => { box.classList.remove('open'); ok.onclick = null; cancel.onclick = null; resolve(val); };
    const ok = $('#confirmOk'), cancel = $('#confirmCancel');
    ok.onclick = () => cleanup(true);
    cancel.onclick = () => cleanup(false);
    box.onclick = (e) => { if (e.target === box) cleanup(false); };
  });
}

/* sidebar — only the categories the Inbound site uses */
const cats = $('#cats');
INBOUND_CATEGORIES.forEach(key => {
  const a = document.createElement('a');
  a.dataset.view = key; a.textContent = CATEGORIES[key].label;
  cats.appendChild(a);
});
document.querySelectorAll('[data-view]').forEach(a => {
  a.addEventListener('click', (e) => { e.preventDefault(); selectView(a.dataset.view); });
});
$('#logout').addEventListener('click', async (e) => { e.preventDefault(); await logout(); location.href = '/admin/login.html'; });

function setActive(view) {
  document.querySelectorAll('[data-view]').forEach(a => a.classList.toggle('on', a.dataset.view === view));
}
async function selectView(view) {
  setActive(view);
  if (view === 'enquiries') { currentCat = null; $('#addBtn').style.display = 'none'; return loadEnq(); }
  currentCat = view;
  const c = CATEGORIES[view];
  $('#viewTitle').textContent = c.label;
  $('#viewSub').textContent = 'Add, edit and remove ' + c.label.toLowerCase();
  $('#addBtn').style.display = '';
  await loadCat(view);
}

function fieldTitle(c, it) { return it[c.fields[0]] || it.title || it.name || '(untitled)'; }

async function loadCat(view) {
  const c = CATEGORIES[view];
  content.innerHTML = '<div class="loading">Loading…</div>';
  try {
    const items = await listItems(view);
    if (!items.length) {
      content.innerHTML = `<div class="empty"><h3>No ${c.label.toLowerCase()} yet</h3><p>Click “Add new” to create your first entry — it appears on the website immediately.</p></div>`;
      return;
    }
    content.innerHTML = '<div class="grid"></div>';
    const grid = content.querySelector('.grid');
    items.forEach(it => {
      const el = document.createElement('article'); el.className = 'item';
      const cover = it.image_url || (Array.isArray(it.gallery) && it.gallery[0]) || '';
      const img = cover ? `<div class="ph"><img src="${cover}" alt=""></div>` : '';
      const gcount = Array.isArray(it.gallery) ? it.gallery.length : 0;
      const hasVid = it.video_url ? ' · video' : '';
      el.innerHTML = `${img}<div class="b">
        <div class="k">${c.label}</div>
        <h3>${esc(fieldTitle(c, it))}</h3>
        <p>${esc(it.description || '').slice(0,120)}</p>
        <div class="gtag">${gcount ? gcount + ' gallery image' + (gcount>1?'s':'') : 'no gallery'}${hasVid}</div>
        <div class="row"><button class="edit">Edit</button><button class="del">Delete</button></div>
      </div>`;
      el.querySelector('.edit').addEventListener('click', () => openForm(view, it));
      el.querySelector('.del').addEventListener('click', () => remove(view, it));
      grid.appendChild(el);
    });
  } catch (ex) { content.innerHTML = `<div class="empty"><h3>Couldn't load</h3><p>${esc(ex.message)}</p></div>`; }
}

$('#addBtn').addEventListener('click', () => openForm(currentCat, null));
$('#cancelBtn').addEventListener('click', () => modal.classList.remove('open'));
$('#saveBtn').addEventListener('click', save);
modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });

function openForm(view, item) {
  const c = CATEGORIES[view];
  const longtext = c.longtext || [];
  const hints = c.hints || {};
  editingId = item ? item.id : null;
  $('#modalTitle').textContent = (item ? 'Edit ' : 'Add ') + c.label.replace(/s$/,'');
  form.innerHTML = '';
  c.fields.forEach(f => {
    const isArr = (c.arrays || []).includes(f);
    const isLong = longtext.includes(f);
    const opts = c.options && c.options[f];
    const label = document.createElement('label');
    label.textContent = f.replace(/_/g,' ');
    form.appendChild(label);

    let input;
    if (opts) {
      input = document.createElement('select');
      opts.forEach(o => { const op = document.createElement('option'); op.value = o; op.textContent = o; input.appendChild(op); });
      input.insertBefore(new Option('—', ''), input.firstChild);
    } else if (isArr || isLong) {
      input = document.createElement('textarea');
      if (isArr) input.rows = 5;
    } else {
      input = document.createElement('input');
      input.type = (f === 'image_url' || f === 'booking_url' || f === 'video_url') ? 'url' : 'text';
    }
    input.name = f;
    if (item && item[f] != null) input.value = Array.isArray(item[f]) ? item[f].join('\n') : item[f];
    form.appendChild(input);

    if (hints[f]) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = hints[f]; form.appendChild(h); }
    else if (isArr) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = 'One per line.'; form.appendChild(h); }
    else if (f === 'image_url') { const h = document.createElement('div'); h.className = 'hint'; h.textContent = 'Main image — paste a URL or an /images/… path.'; form.appendChild(h); }

    if (f === 'image_url') {
      const prev = document.createElement('div');
      prev.className = 'imgprev'; prev.innerHTML = '<img alt="preview">';
      form.appendChild(prev);
      const paint = () => {
        const v = input.value.trim();
        if (v) { prev.querySelector('img').src = v; prev.classList.add('show'); }
        else prev.classList.remove('show');
      };
      input.addEventListener('input', paint); paint();
    }
  });
  modal.classList.add('open');
}

async function save() {
  const c = CATEGORIES[currentCat];
  const data = {};
  new FormData(form).forEach((v, k) => data[k] = v);
  for (const r of (c.required||[])) {
    if (!data[r]) { toast('“'+r+'” is required', 'err'); return; }
  }
  $('#saveBtn').disabled = true; $('#saveBtn').textContent = 'Saving…';
  try {
    await saveItem(currentCat, data, editingId);
    toast(editingId ? 'Updated' : 'Added', 'ok');
    modal.classList.remove('open');
    await loadCat(currentCat);
  } catch (ex) { toast(ex.message, 'err'); }
  $('#saveBtn').disabled = false; $('#saveBtn').textContent = 'Save';
}

async function remove(view, item) {
  const yes = await confirmDialog('Delete this item?', '“' + fieldTitle(CATEGORIES[view], item) + '” will be permanently removed from the website.', 'Delete');
  if (!yes) return;
  try { await deleteItem(view, item.id); toast('Deleted', 'ok'); await loadCat(view); }
  catch (ex) { toast(ex.message, 'err'); }
}

/* enquiries */
async function loadEnq() {
  $('#viewTitle').textContent = 'Enquiries';
  $('#viewSub').textContent = 'Messages from the website';
  content.innerHTML = '<div class="loading">Loading…</div>';
  try {
    const list = await listEnquiries();
    updateBadge(list.filter(e => !e.read).length);
    if (!list.length) { content.innerHTML = '<div class="empty"><h3>No enquiries yet</h3><p>Contact-form messages from the website will appear here.</p></div>'; return; }
    content.innerHTML = '';
    list.forEach(e => {
      const row = document.createElement('div'); row.className = 'enq-row' + (e.read ? '' : ' unread');
      const date = e.created_at && e.created_at.toDate ? e.created_at.toDate().toLocaleString() : '';
      const extra = e.extra && Object.keys(e.extra).length ? Object.entries(e.extra).map(([k,v])=>`${k}: ${v}`).join(' · ') : '';
      row.innerHTML = `<div class="who">
        <div class="n">${esc(e.name||'')}</div>
        <div class="meta">${esc(e.phone||'')}${e.email?' · '+esc(e.email):''}</div>
        ${e.item_title?`<div class="tag">${esc(e.item_title)}</div>`:''}
        ${e.category?`<div class="tag">${esc(e.category)}</div>`:''}
        ${e.message?`<div class="msg">${esc(e.message)}</div>`:''}
        ${extra?`<div class="msg" style="font-size:.8rem;color:var(--ink-45)">${esc(extra)}</div>`:''}
      </div>
      <div class="act">
        <div class="date">${date}</div>
        <button class="viewbtn">View</button>
        <button class="mark">${e.read?'Mark unread':'Mark read'}</button>
        <button class="del">Delete</button>
      </div>`;
      row.querySelector('.viewbtn').addEventListener('click', async () => { openEnqView(e); if(!e.read){ await updateEnquiry(e.id,{read:true}); e.read=true; updateBadge((await listEnquiries()).filter(x=>!x.read).length); } });
      row.querySelector('.mark').addEventListener('click', async () => { await updateEnquiry(e.id, { read: !e.read }); loadEnq(); });
      row.querySelector('.del').addEventListener('click', async () => { const yes = await confirmDialog('Delete this enquiry?', 'This message from ' + (e.name||'the customer') + ' will be permanently removed.', 'Delete'); if(yes){ await deleteEnquiry(e.id); toast('Enquiry deleted','ok'); loadEnq(); } });
      content.appendChild(row);
    });
  } catch (ex) { content.innerHTML = `<div class="empty"><h3>Couldn't load</h3><p>${esc(ex.message)}</p></div>`; }
}
$('#enqLink').addEventListener('click', (e) => { e.preventDefault(); setActive('enquiries'); $('#addBtn').style.display='none'; loadEnq(); });

function updateBadge(n) {
  const b = $('#enqBadge'); b.textContent = n; b.classList.toggle('show', n > 0);
}

try { const all = await listEnquiries(); updateBadge(all.filter(e => !e.read).length); } catch(_) {}
selectView(INBOUND_CATEGORIES[0]);

const enqModal = $('#enqModal');
function fld(label, valueHtml){ return `<div class="fld"><div class="lbl">${esc(label)}</div><div class="val">${valueHtml}</div></div>`; }
function openEnqView(e){
  const date = e.created_at && e.created_at.toDate ? e.created_at.toDate().toLocaleString() : '';
  const email = (e.email||'').trim();
  const phone = (e.phone||'').trim();
  const rows = [];
  rows.push(fld('Name', esc(e.name||'—')));
  rows.push(fld('Phone', phone ? `<a href="tel:${esc(phone)}">${esc(phone)}</a>` : '—'));
  rows.push(fld('Email', email ? `<a href="mailto:${esc(email)}">${esc(email)}</a>` : '—'));
  const tags = [];
  if(e.item_title) tags.push(`<span>${esc(e.item_title)}</span>`);
  if(e.category) tags.push(`<span>${esc(e.category)}</span>`);
  if(tags.length) rows.push(`<div class="fld"><div class="lbl">Regarding</div><div class="val"><div class="tags">${tags.join('')}</div></div></div>`);
  if(e.message) rows.push(`<div class="fld"><div class="lbl">Message</div><div class="val msg">${esc(e.message)}</div></div>`);
  if(e.extra && Object.keys(e.extra).length){
    const ex = Object.entries(e.extra).map(([k,v])=>`${esc(k)}: ${esc(v)}`).join('<br>');
    rows.push(fld('Details', ex));
  }
  if(date) rows.push(fld('Received', esc(date)));
  $('#enqBody').innerHTML = rows.join('');
  $('#enqTitle').textContent = 'Enquiry from ' + (e.name||'customer');
  const reply = $('#enqReply');
  if(email){
    const subj = 'Re: your enquiry to Amja Travels Inbound' + (e.item_title ? ' — ' + e.item_title : '');
    const body = 'Dear ' + (e.name||'') + ',\n\nThank you for contacting Amja Travels Inbound.\n\n';
    reply.href = `mailto:${email}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
    reply.style.display = '';
  } else { reply.href = '#'; reply.style.display = 'none'; }
  enqModal.classList.add('open');
}
$('#enqClose').addEventListener('click', () => enqModal.classList.remove('open'));
enqModal.addEventListener('click', (ev) => { if(ev.target===enqModal) enqModal.classList.remove('open'); });

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
</body>
</html>
