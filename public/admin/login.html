<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login · Amja Travels</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml" />

<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500&family=Raleway:wght@300;400;500;600&family=Abril+Fatface&display=swap" rel="stylesheet" />
<style>
:root{--cream:#FBFCFE;--ink:#1E2F52;--ink-70:rgba(30,47,82,.72);--ink-45:rgba(30,47,82,.45);--ink-15:rgba(30,47,82,.14);
  --ocean:#4C6A9C;--ocean-deep:#22375F;--powder:#B9D0EA;--serif:"Abril Fatface","Cormorant",Georgia,serif;--body:"Raleway",system-ui,sans-serif;--e:cubic-bezier(.19,1,.22,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);font-weight:300;background:radial-gradient(ellipse at 50% 42%,#1a3358 0%,#12244a 46%,#0a1730 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:var(--ink);overflow:hidden}
#loginGlobe{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.box{position:relative;z-index:2;background:rgba(251,252,254,.94);backdrop-filter:blur(10px);border-radius:22px;padding:44px 40px;width:100%;max-width:410px;box-shadow:0 40px 100px rgba(0,0,0,.5)}
/* toast */
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:10px;width:min(360px,90vw)}
.toast{background:var(--ink);color:var(--cream);padding:14px 18px;border-radius:12px;font-size:.86rem;box-shadow:0 12px 30px rgba(0,0,0,.35);animation:tin .3s var(--e);text-align:center}
.toast.ok{background:#227A54}.toast.err{background:#C0392B}
@keyframes tin{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.brand{font-family:var(--serif);font-size:2rem;text-align:center;color:var(--ink)}
.brand i{font-style:italic;color:var(--ocean)}
.sub{text-align:center;font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-45);font-weight:600;margin:8px 0 34px}
label{display:block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--ink-70);margin-bottom:8px}
input{width:100%;padding:14px 16px;border:1px solid var(--ink-15);border-radius:12px;font-family:var(--body);font-size:.95rem;color:var(--ink);outline:none;transition:border-color .3s;margin-bottom:20px}
input:focus{border-color:var(--ocean)}
button{width:100%;padding:15px;background:var(--ocean);color:var(--cream);border:0;border-radius:100px;font-family:var(--body);font-weight:600;font-size:.9rem;cursor:pointer;transition:background .3s}
button:hover{background:var(--ocean-deep)}
button:disabled{opacity:.6;cursor:default}
.err{background:#FDECEA;color:#B23A2E;border-radius:10px;padding:12px 14px;font-size:.84rem;margin-bottom:18px;display:none}
.err.show{display:block}
.back{display:block;text-align:center;margin-top:22px;font-size:.8rem;color:var(--ink-45);text-decoration:none}
.back:hover{color:var(--ocean)}
@media(max-width:480px){.box{padding:34px 24px}.brand{font-size:1.7rem}.toast-wrap{left:12px;right:12px;transform:none;width:auto}}
</style>
</head>
<body>
<canvas id="loginGlobe"></canvas>
<div class="toast-wrap" id="toasts"></div>
<div class="box">
  <div class="brand">Amja <i>Travels</i></div>
  <div class="sub">Admin Portal</div>
  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username" placeholder="admin@amja.local" required />
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required />
    <button type="submit" id="btn">Sign in</button>
  </form>
  <a href="../index.html" class="back">← Back to website</a>
</div>

<!-- 3D moving starfield background (cursor parallax) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  if (!window.THREE) return;
  const canvas = document.getElementById('loginGlobe');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 1, 1000);
  camera.position.z = 1;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);

  const starCount = 2000;
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(starCount * 3);
  const colors = new Float32Array(starCount * 3);
  const velocities = new Float32Array(starCount);
  // navy-palette star colours: powder, periwinkle, cream, denim
  const PALETTE = [
    [0.725, 0.816, 0.917],  // powder #B9D0EA
    [0.662, 0.737, 0.862],  // periwinkle #A9BCDC
    [0.984, 0.988, 0.996],  // cream
    [0.560, 0.706, 0.902],  // soft blue
  ];
  for (let i = 0; i < starCount; i++) {
    positions[i*3] = (Math.random()-0.5)*1200;
    positions[i*3+1] = (Math.random()-0.5)*1200;
    positions[i*3+2] = Math.random()*1000;
    const c = PALETTE[(Math.random()*PALETTE.length)|0];
    colors[i*3]=c[0]; colors[i*3+1]=c[1]; colors[i*3+2]=c[2];
    velocities[i] = 0.4 + Math.random()*0.7;
  }
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const starMaterial = new THREE.PointsMaterial({
    size: 1.7, transparent: true, opacity: 0.92,
    vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false,
  });
  scene.add(new THREE.Points(geometry, starMaterial));

  let mouseX = 0, mouseY = 0;
  addEventListener('mousemove', e => { mouseX = e.clientX/innerWidth-0.5; mouseY = e.clientY/innerHeight-0.5; });
  addEventListener('touchmove', e => { if (e.touches[0]) { mouseX = e.touches[0].clientX/innerWidth-0.5; mouseY = e.touches[0].clientY/innerHeight-0.5; } }, { passive: true });

  (function animate() {
    requestAnimationFrame(animate);
    const pos = geometry.attributes.position.array;
    for (let i = 0; i < starCount; i++) {
      pos[i*3+2] -= velocities[i];
      if (pos[i*3+2] < 0) { pos[i*3]=(Math.random()-0.5)*1200; pos[i*3+1]=(Math.random()-0.5)*1200; pos[i*3+2]=1000; }
    }
    geometry.attributes.position.needsUpdate = true;
    camera.position.x += (mouseX*25 - camera.position.x)*0.03;
    camera.position.y += (-mouseY*25 - camera.position.y)*0.03;
    camera.lookAt(0,0,0);
    renderer.render(scene, camera);
  })();
  addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
})();
</script>

<script type="module">
import { login, onAdmin } from '../assets/auth.js';

function toast(msg, type='') {
  const t = document.createElement('div');
  t.className = 'toast ' + type; t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), 3600);
}

// if already signed in as admin, go to dashboard
onAdmin((res) => { if (res && res.isAdmin) location.href = '/admin/index.html'; });

const form = document.getElementById('loginForm');
const btn = document.getElementById('btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const cred = await login(document.getElementById('email').value.trim(), document.getElementById('password').value);
    const token = await cred.user.getIdTokenResult();
    if (token.claims.admin !== true) throw new Error('This account is not an administrator.');
    toast('Welcome back — signing you in…', 'ok');
    setTimeout(() => location.href = '/admin/index.html', 700);
  } catch (ex) {
    let msg = 'Sign in failed. Check your email and password.';
    if (ex.code === 'auth/invalid-credential' || ex.code === 'auth/wrong-password') msg = 'Incorrect email or password.';
    else if (ex.code === 'auth/user-not-found') msg = 'No admin account with that email.';
    else if (ex.code === 'auth/too-many-requests') msg = 'Too many attempts. Please wait a moment and try again.';
    else if (ex.code === 'auth/invalid-email') msg = 'Please enter a valid email address.';
    else if (ex.message) msg = ex.message;
    toast(msg, 'err');
    btn.disabled = false; btn.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
