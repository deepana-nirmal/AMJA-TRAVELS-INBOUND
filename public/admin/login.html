<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Sign In · Amja Travels Inbound</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" href="../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{--ink:#182A44;--ink-70:rgba(24,42,68,.72);--ink-45:rgba(24,42,68,.45);--line:rgba(24,42,68,.14);
  --paper:#FBF6EF;--cream:#FFFDF9;--deep:#122036;--sun:#DC7A34;--sun-deep:#B4551F;--gold:#E7B15A;
  --serif:"Fraunces",Georgia,serif;--body:"Inter",system-ui,sans-serif;--e:cubic-bezier(.19,1,.22,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:var(--ink);
  background:radial-gradient(1200px 600px at 50% -10%, #1b2f4c 0%, #122036 45%, #0c1626 100%);overflow:hidden}
.rays{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background:
    conic-gradient(from 0deg at 50% 30%, transparent 0 8deg, rgba(231,177,90,.10) 8deg 12deg, transparent 12deg 30deg,
    rgba(220,122,52,.08) 30deg 34deg, transparent 34deg 60deg);
  animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.rays{animation:none}}
.box{position:relative;z-index:2;background:rgba(251,246,239,.96);backdrop-filter:blur(10px);border-radius:22px;padding:44px 40px;width:100%;max-width:410px;box-shadow:0 40px 100px rgba(0,0,0,.5)}
.mark{width:52px;height:52px;margin:0 auto 16px;display:block}
.mark .r{fill:none;stroke:var(--sun);stroke-width:3;stroke-linecap:round}
.mark .s{fill:var(--sun)}
.brand{font-family:var(--serif);font-size:1.7rem;font-weight:600;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
.brand .arm{font-family:var(--body);font-size:.55rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;background:var(--sun);color:#fff;padding:3px 7px;border-radius:5px}
.sub{text-align:center;font-size:.64rem;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-45);font-weight:700;margin:8px 0 32px}
label{display:block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink-70);margin-bottom:8px}
input{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:12px;font-family:var(--body);font-size:.95rem;color:var(--ink);outline:none;transition:border-color .3s;margin-bottom:20px;background:#fff}
input:focus{border-color:var(--sun)}
button{width:100%;padding:15px;background:var(--sun);color:#fff;border:0;border-radius:100px;font-family:var(--body);font-weight:600;font-size:.9rem;cursor:pointer;transition:background .3s}
button:hover{background:var(--sun-deep)}
button:disabled{opacity:.6;cursor:default}
.back{display:block;text-align:center;margin-top:22px;font-size:.8rem;color:var(--ink-45)}
.back:hover{color:var(--sun-deep)}
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:10px;width:min(360px,90vw)}
.toast{background:var(--ink);color:var(--paper);padding:14px 18px;border-radius:12px;font-size:.86rem;box-shadow:0 12px 30px rgba(0,0,0,.35);animation:tin .3s var(--e);text-align:center}
.toast.ok{background:#227A54}.toast.err{background:#C0392B}
@keyframes tin{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:480px){.box{padding:34px 24px}.toast-wrap{left:12px;right:12px;transform:none;width:auto}}
</style>
</head>
<body>
<div class="rays"></div>
<div class="toast-wrap" id="toasts"></div>
<div class="box">
  <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
    <circle class="s" cx="50" cy="50" r="12"/>
    <g class="r"><line x1="50" y1="14" x2="50" y2="26"/><line x1="50" y1="74" x2="50" y2="86"/><line x1="14" y1="50" x2="26" y2="50"/><line x1="74" y1="50" x2="86" y2="50"/><line x1="24" y1="24" x2="33" y2="33"/><line x1="67" y1="67" x2="76" y2="76"/><line x1="76" y1="24" x2="67" y2="33"/><line x1="33" y1="67" x2="24" y2="76"/></g>
  </svg>
  <div class="brand">Amja Travels <span class="arm">Inbound</span></div>
  <div class="sub">Content Admin</div>
  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username" placeholder="Your admin email" required />
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" placeholder="Your password" required />
    <button type="submit" id="btn">Sign in</button>
  </form>
  <a href="../index.html" class="back">← Back to website</a>
</div>

<script type="module">
import { login, onAdmin } from '../assets/auth.js';

function toast(msg, type='') {
  const t = document.createElement('div');
  t.className = 'toast ' + type; t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), 3600);
}

onAdmin((res) => { if (res && res.isAdmin) location.href = '/admin/index.html'; });

const form = document.getElementById('loginForm');
const btn = document.getElementById('btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const cred = await login(document.getElementById('email').value.trim(), document.getElementById('password').value);
    const token = await cred.user.getIdTokenResult();
    if (token.claims.admin !== true) throw new Error('This account is not an administrator.');
    toast('Welcome back — signing you in…', 'ok');
    setTimeout(() => location.href = '/admin/index.html', 700);
  } catch (ex) {
    let msg = 'Sign in failed. Check your email and password.';
    if (ex.code === 'auth/invalid-credential' || ex.code === 'auth/wrong-password') msg = 'Incorrect email or password.';
    else if (ex.code === 'auth/user-not-found') msg = 'No admin account with that email.';
    else if (ex.code === 'auth/too-many-requests') msg = 'Too many attempts. Please wait a moment and try again.';
    else if (ex.code === 'auth/invalid-email') msg = 'Please enter a valid email address.';
    else if (ex.message) msg = ex.message;
    toast(msg, 'err');
    btn.disabled = false; btn.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
